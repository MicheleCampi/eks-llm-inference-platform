# Karpenter alerts. Prometheus format: the same file for promtool (CI) and the
# Grafana-managed rules of Grafana Cloud, as in vllm-coldstart-operator
# (ADR-0021). Metric and label names read in the code of Karpenter v1.15.1
# (core pkg/metrics/labels.go, controllers/metrics/nodepool; aws
# controllers/interruption): CPU is in cores, resource_type "cpu".
# No absent(): after the cluster is destroyed it would page forever.
groups:
  - name: karpenter
    rules:
      - alert: KarpenterNodePoolCpuLimitReached
        # The NodePool provisioned all the CPU its limits allow: new pods stay
        # Pending until something is removed or the limit is raised.
        expr: max by (nodepool) (karpenter_nodepools_usage{resource_type="cpu"}) >= on (nodepool) max by (nodepool) (karpenter_nodepools_limit{resource_type="cpu"})
        for: 5m
        labels:
          severity: page
        annotations:
          runbook_url: https://github.com/MicheleCampi/eks-llm-inference-platform/blob/main/docs/runbooks/karpenter.md
      - alert: KarpenterControllerDown
        # Alloy reaches the Service but the controller does not answer.
        expr: up{job="karpenter"} == 0
        for: 5m
        labels:
          severity: page
        annotations:
          runbook_url: https://github.com/MicheleCampi/eks-llm-inference-platform/blob/main/docs/runbooks/karpenter.md
      - alert: KarpenterSpotInterruption
        # EC2 announced a Spot interruption or a rebalance: Karpenter drains
        # and replaces the node; a ticket, not a page.
        expr: increase(karpenter_interruption_received_messages_total{message_type=~"spot_interrupted|rebalance_recommendation"}[10m]) > 0
        labels:
          severity: ticket
        annotations:
          runbook_url: https://github.com/MicheleCampi/eks-llm-inference-platform/blob/main/docs/runbooks/karpenter.md
      - alert: KarpenterNodeClaimLaunchFailed
        # Karpenter deleted a NodeClaim because its instance did not launch or
        # its node did not register in time (5 and 15 min liveness timeouts,
        # core pkg/controllers/nodeclaim/lifecycle), or the EC2NodeClass was
        # not ready: capacity was asked for and did not arrive.
        expr: sum by (nodepool, reason) (increase(karpenter_nodeclaims_disrupted_total{reason=~"launch_timeout|registration_timeout|nodeclass_not_ready"}[30m])) > 0
        labels:
          severity: ticket
        annotations:
          runbook_url: https://github.com/MicheleCampi/eks-llm-inference-platform/blob/main/docs/runbooks/karpenter.md
      - alert: KarpenterInsufficientCapacityRepeated
        # One insufficient-capacity error is normal for Spot: Karpenter retries
        # another offering. Three in 30 minutes mean the pool is too narrow
        # (3 instance types on the Free Plan account).
        expr: sum by (nodepool, capacity_type) (increase(karpenter_nodeclaims_disrupted_total{reason="insufficient_capacity"}[30m])) >= 3
        labels:
          severity: ticket
        annotations:
          runbook_url: https://github.com/MicheleCampi/eks-llm-inference-platform/blob/main/docs/runbooks/karpenter.md
      - alert: KarpenterPodsUnschedulable
        # Pods that no NodePool can host (limit reached, no matching pool, a
        # GPU request while pool gpu is gated) for 15 minutes: work is not
        # running. Gauge set by the provisioner on every scheduling pass.
        expr: max(karpenter_scheduler_unschedulable_pods_count) > 0
        for: 15m
        labels:
          severity: page
        annotations:
          runbook_url: https://github.com/MicheleCampi/eks-llm-inference-platform/blob/main/docs/runbooks/karpenter.md
      - alert: NodeNotReady
        # A node reports Ready other than "true" (false or unknown) for 10
        # minutes. kube-state-metrics, collector nodes. A node Karpenter
        # deletes loses its series, so a normal termination does not fire.
        expr: max by (node) (kube_node_status_condition{condition="Ready",status="true"}) == 0
        for: 10m
        labels:
          severity: page
        annotations:
          runbook_url: https://github.com/MicheleCampi/eks-llm-inference-platform/blob/main/docs/runbooks/karpenter.md
      - alert: KarpenterControllerUnavailable
        # No Karpenter replica available for 5 minutes, from kube-state-metrics.
        # Covers what KarpenterControllerDown cannot: scaled to 0 or never
        # scheduled leaves no endpoint, so no target and no up series (found
        # designing game day #1, docs/gameday/README.md). After a destroy the
        # series is gone, so it never pages forever.
        expr: max(kube_deployment_status_replicas_available{namespace="kube-system",deployment="karpenter"}) < 1
        for: 5m
        labels:
          severity: page
        annotations:
          runbook_url: https://github.com/MicheleCampi/eks-llm-inference-platform/blob/main/docs/runbooks/karpenter.md
  - name: workloads
    rules:
      - alert: PodCrashLooping
        # A container restarted 3 or more times in 10 minutes: a bad change
        # (image, config, memory) that the make-before-break rollout keeps
        # away from users, but which never becomes Ready. A ticket: the old
        # replicas still serve. kube-system is left to EKS and its add-ons.
        expr: sum by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total{namespace!="kube-system"}[10m])) >= 3
        labels:
          severity: ticket
        annotations:
          runbook_url: https://github.com/MicheleCampi/eks-llm-inference-platform/blob/main/docs/runbooks/workloads.md
