# promtool test rules observability/karpenter-rules.test.yaml
rule_files: [karpenter-rules.yaml]
evaluation_interval: 1m
tests:
  # The NodePool reached its 8 CPU limit and stays there: fires after 5 min.
  - interval: 1m
    input_series:
      - series: 'karpenter_nodepools_usage{nodepool="default",resource_type="cpu"}'
        values: '8x20'
      - series: 'karpenter_nodepools_limit{nodepool="default",resource_type="cpu"}'
        values: '8x20'
      - series: 'karpenter_nodepools_usage{nodepool="default",resource_type="memory"}'
        values: '1e10x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: KarpenterNodePoolCpuLimitReached
        exp_alerts:
          - exp_labels: {severity: page, nodepool: default}
            exp_annotations: {runbook_url: https://github.com/MicheleCampi/eks-llm-inference-platform/blob/main/docs/runbooks/karpenter.md}
  # 6 of 8 CPU (the 3-replica test): nothing fires.
  - interval: 1m
    input_series:
      - series: 'karpenter_nodepools_usage{nodepool="default",resource_type="cpu"}'
        values: '6x20'
      - series: 'karpenter_nodepools_limit{nodepool="default",resource_type="cpu"}'
        values: '8x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: KarpenterNodePoolCpuLimitReached
        exp_alerts: []
  # The controller stops answering: fires after 5 min; while up, nothing.
  - interval: 1m
    input_series:
      - series: 'up{job="karpenter",instance="10.0.32.10:8080"}'
        values: '1x4 0x16'
    alert_rule_test:
      - eval_time: 4m
        alertname: KarpenterControllerDown
        exp_alerts: []
      - eval_time: 12m
        alertname: KarpenterControllerDown
        exp_alerts:
          - exp_labels: {severity: page, job: karpenter, instance: "10.0.32.10:8080"}
            exp_annotations: {runbook_url: https://github.com/MicheleCampi/eks-llm-inference-platform/blob/main/docs/runbooks/karpenter.md}
  # A Spot interruption message arrives; a no_op message does not count.
  - interval: 1m
    input_series:
      - series: 'karpenter_interruption_received_messages_total{message_type="spot_interrupted"}'
        values: '0x5 1x15'
      - series: 'karpenter_interruption_received_messages_total{message_type="no_op"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 8m
        alertname: KarpenterSpotInterruption
        exp_alerts:
          - exp_labels: {severity: ticket, message_type: spot_interrupted}
            exp_annotations: {runbook_url: https://github.com/MicheleCampi/eks-llm-inference-platform/blob/main/docs/runbooks/karpenter.md}
  # A node fails to register (registration_timeout): fires at once, a ticket.
  # A consolidation (reason underutilized) does not count.
  - interval: 1m
    input_series:
      - series: 'karpenter_nodeclaims_disrupted_total{nodepool="general",reason="registration_timeout",capacity_type="spot",consolidation_policy="",termination_mode="graceful"}'
        values: '0x5 1x25'
      - series: 'karpenter_nodeclaims_disrupted_total{nodepool="general",reason="underutilized",capacity_type="spot",consolidation_policy="WhenEmptyOrUnderutilized",termination_mode="graceful"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 4m
        alertname: KarpenterNodeClaimLaunchFailed
        exp_alerts: []
      - eval_time: 10m
        alertname: KarpenterNodeClaimLaunchFailed
        exp_alerts:
          - exp_labels: {severity: ticket, nodepool: general, reason: registration_timeout}
            exp_annotations: {runbook_url: https://github.com/MicheleCampi/eks-llm-inference-platform/blob/main/docs/runbooks/karpenter.md}
  # Spot insufficient capacity: 2 in 30 min is normal (minute 12), the 3rd (minute 17) fires.
  - interval: 1m
    input_series:
      - series: 'karpenter_nodeclaims_disrupted_total{nodepool="general",reason="insufficient_capacity",capacity_type="spot",consolidation_policy="",termination_mode="graceful"}'
        values: '0x4 1x5 2x5 3x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: KarpenterInsufficientCapacityRepeated
        exp_alerts: []
      - eval_time: 20m
        alertname: KarpenterInsufficientCapacityRepeated
        exp_alerts:
          - exp_labels: {severity: ticket, nodepool: general, capacity_type: spot}
            exp_annotations: {runbook_url: https://github.com/MicheleCampi/eks-llm-inference-platform/blob/main/docs/runbooks/karpenter.md}
  # One pod unschedulable 6 min, then from minute 13: pages at 30 (15 min), the blip does not.
  - interval: 1m
    input_series:
      - series: 'karpenter_scheduler_unschedulable_pods_count{controller="provisioner"}'
        values: '0x2 1x5 0x3 1x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: KarpenterPodsUnschedulable
        exp_alerts: []
      - eval_time: 30m
        alertname: KarpenterPodsUnschedulable
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations: {runbook_url: https://github.com/MicheleCampi/eks-llm-inference-platform/blob/main/docs/runbooks/karpenter.md}
  # Node a turns NotReady (status true -> 0) and pages after 10 min; node b
  # stays Ready; node c disappears (Karpenter terminated it) and never fires.
  - interval: 1m
    input_series:
      - series: 'kube_node_status_condition{node="a",condition="Ready",status="true"}'
        values: '1x3 0x20'
      - series: 'kube_node_status_condition{node="b",condition="Ready",status="true"}'
        values: '1x23'
      - series: 'kube_node_status_condition{node="c",condition="Ready",status="true"}'
        values: '1x3 _x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: NodeNotReady
        exp_alerts: []
      - eval_time: 15m
        alertname: NodeNotReady
        exp_alerts:
          - exp_labels: {severity: page, node: a}
            exp_annotations: {runbook_url: https://github.com/MicheleCampi/eks-llm-inference-platform/blob/main/docs/runbooks/karpenter.md}
  # Karpenter scaled to 0 (game day #1 S3): available drops to 0 and pages
  # after 5 min; KarpenterControllerDown would see no target at all.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="kube-system",deployment="karpenter"}'
        values: '2x3 0x15'
      - series: 'kube_deployment_status_replicas_available{namespace="kube-system",deployment="coredns"}'
        values: '0x18'
    alert_rule_test:
      - eval_time: 6m
        alertname: KarpenterControllerUnavailable
        exp_alerts: []
      - eval_time: 12m
        alertname: KarpenterControllerUnavailable
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations: {runbook_url: https://github.com/MicheleCampi/eks-llm-inference-platform/blob/main/docs/runbooks/karpenter.md}
  # One replica of two available: degraded but running, nothing fires.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="kube-system",deployment="karpenter"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: KarpenterControllerUnavailable
        exp_alerts: []
  # The live #3 OOM re-introduced (game day #1 S2): 3 restarts in 10 min fire
  # a ticket; one restart does not; kube-system is ignored.
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="inference-test",pod="qwen-0-5b-cpu-new",container="vllm"}'
        values: '0x2 1 1 2 2 3 3 4x5'
      - series: 'kube_pod_container_status_restarts_total{namespace="inference-test",pod="qwen-0-5b-cpu-old",container="vllm"}'
        values: '0x5 1x10'
      - series: 'kube_pod_container_status_restarts_total{namespace="kube-system",pod="aws-node-x",container="aws-node"}'
        values: '0+1x15'
    alert_rule_test:
      - eval_time: 4m
        alertname: PodCrashLooping
        exp_alerts: []
      - eval_time: 9m
        alertname: PodCrashLooping
        exp_alerts:
          - exp_labels: {severity: ticket, namespace: inference-test, pod: qwen-0-5b-cpu-new, container: vllm}
            exp_annotations: {runbook_url: https://github.com/MicheleCampi/eks-llm-inference-platform/blob/main/docs/runbooks/workloads.md}
