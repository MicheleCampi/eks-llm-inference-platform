# Weekly update proposals, one grouped pull request per ecosystem.
# A proposal only runs the PR checks; nothing is released or applied
# until a maintainer merges it and tags a release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: terraform
    directories:
      - /
      - /bootstrap/ci-identity
      - /observability/terraform
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
