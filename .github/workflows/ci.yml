name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (terraform fmt, validate, test; secrets; workflow lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned tools (inference-platform-ci, pinned in ci/platform-ci.env)
        run: bash ci/install-tools.sh
      - name: Validate
        run: bash ci/validate.sh

  # terraform plan against the real account on pull requests. Credentials come
  # from GitHub OIDC: no stored keys, no third-party action. The role
  # (bootstrap/ci-identity) trusts only this repo's pull requests, reads this
  # stack's state and writes only its lock file. Skipped until the repo
  # variable AWS_PLAN_ROLE_ARN is set.
  plan:
    name: terraform plan (OIDC, read-only role)
    if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != ''
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools (inference-platform-ci, pinned in ci/platform-ci.env)
        run: bash ci/install-tools.sh
      - name: GitHub OIDC token for AWS STS
        run: |
          curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value > "$RUNNER_TEMP/web-identity-token"
          test -s "$RUNNER_TEMP/web-identity-token"
          echo "AWS_WEB_IDENTITY_TOKEN_FILE=$RUNNER_TEMP/web-identity-token" >> "$GITHUB_ENV"
      - name: terraform plan
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
          AWS_ROLE_SESSION_NAME: gha-plan-${{ github.run_id }}
          AWS_REGION: eu-west-1
        run: |
          export PATH="$PWD/.ci-bin:$PATH"
          terraform init -input=false -no-color
          terraform plan -input=false -no-color -lock-timeout=60s
