name: finops-guardrail

# FinOps guardrail at the peak: llm-d-router v1.0.0 flow control with
# priority holdback (premium protected, batch sheddable with 429) against the
# same router with no policy, under the replayed Azure trace, on kind, on a
# GitHub-hosted runner: zero cloud cost. Protocol and hypotheses in
# experiments/finops-guardrail/README.md, results in docs/evidence/.
# On a pull request the smoke test runs the whole chain (CRDs, InferencePool,
# InferenceObjectives, flow control, tenant header, report) against the
# llm-d inference simulator under a burst: mechanics only, no numbers. The
# measurement with vLLM CPU runs on demand, two jobs in opposite arm orders,
# and does not gate.

on:
  pull_request:
    paths:
      - experiments/finops-guardrail/**
      - experiments/capacity-knee/**
      - experiments/trace-replay/**
      - .github/workflows/finops-guardrail.yml
  workflow_dispatch:
    inputs:
      jobs:
        description: "jobs to run, comma-separated: 1 = nopolicy, guardrail, guardrail, nopolicy; 2 = the reverse; 3 and 4 = experiments/capacity-knee (nopolicy, m1-m4 up or down, nopolicy). A job stopped by the runner check is run again alone"
        default: "1,2"

permissions:
  contents: read

concurrency:
  group: finops-guardrail-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'pr' }}
  cancel-in-progress: true

env:
  KIND_VERSION: v0.33.0
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d

jobs:
  smoke:
    name: smoke (flow control, objectives, 429 and report on the simulator)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools (helm from inference-platform-ci; kind by SHA-256)
        run: |
          bash ci/install-tools.sh > /dev/null
          echo "$PWD/.ci-bin" >> "$GITHUB_PATH"
          curl -fsSLo /tmp/kind "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64"
          echo "$KIND_SHA256  /tmp/kind" | sha256sum -c -
          sudo install /tmp/kind /usr/local/bin/kind
      - name: Pins from versions.env into the job environment
        run: grep -E '^[A-Z_]+=' experiments/prefix-routing/versions.env >> "$GITHUB_ENV"
      - name: kind, CRDs, simulator
        run: |
          bash experiments/finops-guardrail/run.sh up
          bash experiments/finops-guardrail/run.sh backend sim
      - name: The busiest 240 s of the conv window at 8 req/s mean (stub values, not a calibration)
        working-directory: experiments/trace-replay
        run: |
          python3 trace.py thin results/window-conv.json 8 1 results/s.json
          python3 -c "import json; s=json.load(open('results/s.json')); s['requests']=[r for r in s['requests'] if 480 <= r[0] < 720]; [r.__setitem__(0, r[0] - 480) for r in s['requests']]; s['meta']['replay_s']=240; json.dump(s,open('results/schedule-conv.json','w'))"
          echo '{"trace": "conv", "T": 1.0, "P": 0.1, "C": 0, "rate": 8}' > results/calib-conv.json
      - name: nopolicy, then guardrail
        env:
          MODEL_NAME: sim-qwen2.5-0.5b
        run: |
          bash experiments/finops-guardrail/run.sh arm nopolicy nopolicy-1
          bash experiments/finops-guardrail/run.sh arm guardrail guardrail-1
      - name: Report (mechanics; the simulator's numbers mean nothing)
        if: always()
        run: bash experiments/finops-guardrail/run.sh report | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Mechanics check (guardrail sheds batch with 429 only, premium never; no policy sheds nothing)
        working-directory: experiments/finops-guardrail
        run: |
          python3 - <<'PY'
          import json
          def classes(name):
              out = {}
              for l in open(f"results/{name}.jsonl"):
                  if l.startswith('{"req"'):
                      r = json.loads(l)["req"]
                      key = (r.get("tenant"), r.get("code"))
                      out[key] = out.get(key, 0) + 1
              return out
          n, g = classes("nopolicy-1"), classes("guardrail-1")
          print("nopolicy:", n); print("guardrail:", g)
          assert not any(c == 429 for (_, c) in n), "429 without a policy"
          assert g.get(("batch", 429), 0) > 0, "guardrail shed no batch request under the burst"
          assert not any(t == "premium" and c != 200 for (t, c) in g), "a premium request was not served"
          assert not any(t == "batch" and c not in (200, 429) for (t, c) in g), "a batch request failed with something other than 429"
          PY
      - name: Cluster state on failure
        if: failure()
        timeout-minutes: 3
        run: |
          k="kubectl --request-timeout=20s -n bench"
          $k get pods,inferencepool,inferenceobjective -o wide || true
          $k logs deploy/router-epp -c epp --tail=120 || true
          $k get events --sort-by=.lastTimestamp | tail -40 || true

  jobs:
    name: jobs to run
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        env:
          JOBS: ${{ inputs.jobs }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          order = {"1": "nopolicy guardrail guardrail nopolicy", "2": "guardrail nopolicy nopolicy guardrail",
                   "3": "nopolicy m1 m2 m3 m4 nopolicy", "4": "nopolicy m4 m3 m2 m1 nopolicy"}
          want = [j.strip() for j in os.environ["JOBS"].split(",") if j.strip()]
          assert want and all(j in order for j in want), f"unknown job in {want}"
          print("include=" + json.dumps([{"job": j, "arms": order[j]} for j in want]))
          PY

  run:
    name: job ${{ matrix.job }} (calibration, ${{ matrix.arms }})
    needs: jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.jobs.outputs.include) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runner CPU (the rules of experiments/canary-rollback, amendment 3)
        run: |
          { lscpu | grep -E '^(Model name|CPU\(s\)):'; echo "ISA: $(grep -o -w -E 'avx512f|amx_tile' /proc/cpuinfo | sort -u | tr '\n' ' ')"; } | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q -w avx512f /proc/cpuinfo || { echo "::error::runner without AVX-512; re-run this job"; exit 1; }
          if grep -q GenuineIntel /proc/cpuinfo && ! grep -q -w amx_tile /proc/cpuinfo; then echo "::error::Intel runner without AMX; re-run this job"; exit 1; fi

      - name: Install pinned tools (helm from inference-platform-ci; kind by SHA-256)
        run: |
          bash ci/install-tools.sh > /dev/null
          echo "$PWD/.ci-bin" >> "$GITHUB_PATH"
          curl -fsSLo /tmp/kind "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64"
          echo "$KIND_SHA256  /tmp/kind" | sha256sum -c -
          sudo install /tmp/kind /usr/local/bin/kind

      - name: Pins from versions.env into the job environment
        run: grep -E '^[A-Z_]+=' experiments/prefix-routing/versions.env >> "$GITHUB_ENV"

      - name: Pull the vLLM CPU image from the project's public mirror (same digest as upstream)
        run: |
          for i in 1 2 3; do docker pull -q "$VLLM_CPU_IMAGE" && break; sleep $((30 * i)); done
          docker tag "$VLLM_CPU_IMAGE" vllm-cpu-ci:pinned

      - name: Restore the model from the Actions cache
        id: model-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/hf-cache
          key: hf-qwen2.5-0.5b-instruct-${{ env.MODEL_REVISION }}

      - name: Fetch the model at the pinned commit, with the vLLM image's own client
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/hf-cache
          for i in 1 2 3; do
            timeout 600 docker run --rm -v "$HOME/hf-cache:/root/.cache/huggingface" \
              -e HF_HUB_DOWNLOAD_TIMEOUT=30 -e HF_HUB_ETAG_TIMEOUT=15 --entrypoint python3 vllm-cpu-ci:pinned -c \
              "from huggingface_hub import snapshot_download as s; print(s('$MODEL', revision='$MODEL_REVISION', allow_patterns=['*.json','*.safetensors','*.txt','tokenizer*']))" && exit 0
            sleep $((30 * i))
          done
          exit 1

      - name: kind, CRDs
        run: HF_CACHE=$HOME/hf-cache bash experiments/finops-guardrail/run.sh up

      - name: Load the vLLM image into the node
        run: kind load docker-image vllm-cpu-ci:pinned --name trace-replay

      - name: Model servers
        run: bash experiments/finops-guardrail/run.sh backend vllm

      - name: Calibration (step 7 code and rules)
        run: bash experiments/finops-guardrail/run.sh calibrate

      - name: Arms in this job's order
        env:
          JOB: ${{ matrix.job }}
          ARMS: ${{ matrix.arms }}
        run: |
          declare -A n=()
          for a in $ARMS; do
            n[$a]=$((${n[$a]:-0} + 1))
            # mN = the guardrail at maxConcurrency N per replica (experiments/capacity-knee)
            if [[ $a =~ ^m([0-9])$ ]]; then
              MAX_CONC=${BASH_REMATCH[1]} bash experiments/finops-guardrail/run.sh arm guardrail "$a-$JOB-${n[$a]}"
            else
              bash experiments/finops-guardrail/run.sh arm "$a" "$a-$JOB-${n[$a]}"
            fi
          done

      - name: Report
        if: always()
        env:
          KNEE: ${{ (matrix.job == '3' || matrix.job == '4') && '1' || '' }}
        run: |
          bash experiments/finops-guardrail/run.sh report || true
          cat experiments/finops-guardrail/results/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Cluster state on failure
        if: failure()
        timeout-minutes: 3
        run: |
          k="kubectl --request-timeout=20s -n bench"
          $k get pods,inferencepool,inferenceobjective -o wide || true
          $k logs -l app=model --tail=60 || true
          $k logs deploy/router-epp -c epp --tail=120 || true
          $k get events --sort-by=.lastTimestamp | tail -60 || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: finops-guardrail-job-${{ matrix.job }}
          path: |
            experiments/finops-guardrail/results/*.jsonl
            experiments/finops-guardrail/results/*.json
            experiments/finops-guardrail/results/*.log
            experiments/finops-guardrail/results/report.md
            experiments/finops-guardrail/results/*.yaml
            experiments/trace-replay/results/calib-*
          if-no-files-found: ignore
