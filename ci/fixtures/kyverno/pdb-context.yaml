# Cluster state for require-pdb (kyverno apply --context-file): the
# PodDisruptionBudgets of tests/live/inflate.yaml and tests/gameday/model.yaml,
# as the API server returns them.
apiVersion: cli.kyverno.io/v1alpha1
kind: Context
metadata:
  name: pdb
spec:
  resources:
    - apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: inflate
        namespace: karpenter-test
      spec:
        maxUnavailable: 1
        selector: {matchLabels: {app: inflate}}
    # Game day #1: the PDB of tests/gameday/model.yaml, for the model at 2 replicas.
    - apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: qwen-0-5b-cpu
        namespace: inference-test
      spec:
        minAvailable: 1
        selector: {matchLabels: {app: qwen-0-5b-cpu}}
    # Live A-025: the PDB of experiments/prefix-routing/eks/model.yaml.
    - apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: qwen-prefix
        namespace: inference-bench
      spec:
        minAvailable: 1
        selector: {matchLabels: {app: qwen-prefix}}
