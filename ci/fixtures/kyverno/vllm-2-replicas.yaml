# Game day #1: the Deployment the operator v0.13.0 builds for
# tests/gameday/model.yaml, 2 replicas (labels, selector, image and
# requests as in its src/main.rs). With its PDB in the
# context it must pass require-pdb; ci/validate-gitops.sh also checks it is
# rejected when its pods are not selected by any PDB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-0-5b-cpu
  namespace: inference-test
  labels: {app: qwen-0-5b-cpu, app.kubernetes.io/managed-by: vllm-coldstart-operator}
spec:
  replicas: 2
  selector:
    matchLabels: {app: qwen-0-5b-cpu, app.kubernetes.io/managed-by: vllm-coldstart-operator}
  template:
    metadata:
      labels: {app: qwen-0-5b-cpu, app.kubernetes.io/managed-by: vllm-coldstart-operator}
    spec:
      containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai-cpu:v0.34.0-x86_64@sha256:b14c3a46a4b08852b32528643e070d57f3731cccb0fa33ef86d4f3b3f8ac36c4
          resources:
            requests: {cpu: "1", memory: 6Gi}
            limits: {cpu: "1", memory: 6Gi}
