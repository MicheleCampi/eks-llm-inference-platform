apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.10.0
    helm:
      releaseName: kyverno
      valuesObject:
        admissionController: {podSecurityContext: {"runAsNonRoot": true, "seccompProfile": {"type": "RuntimeDefault"}}}
        backgroundController: {podSecurityContext: {"runAsNonRoot": true, "seccompProfile": {"type": "RuntimeDefault"}}}
        cleanupController: {podSecurityContext: {"runAsNonRoot": true, "seccompProfile": {"type": "RuntimeDefault"}}}
        reportsController: {podSecurityContext: {"runAsNonRoot": true, "seccompProfile": {"type": "RuntimeDefault"}}}
        crds: {migration: {podSecurityContext: {"runAsNonRoot": true, "seccompProfile": {"type": "RuntimeDefault"}}}}
        webhooksCleanup: {podSecurityContext: {"runAsNonRoot": true, "seccompProfile": {"type": "RuntimeDefault"}}}
        upgrade: {legacyPolicyCheck: {podSecurityContext: {"runAsNonRoot": true, "seccompProfile": {"type": "RuntimeDefault"}}}}
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
