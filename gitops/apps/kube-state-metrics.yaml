apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-state-metrics
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-state-metrics
    targetRevision: 9.0.1
    helm:
      releaseName: ksm
      values: |
        # Only what the requests-vs-usage dashboard needs (Grafana Cloud free tier bound).
        collectors: [pods, nodes, namespaces]
        metricAllowlist:
          - kube_pod_container_resource_requests
          - kube_namespace_labels
          - kube_node_labels
        # Showback: team and cost centre come from the namespace (the quota boundary), not from each pod.
        metricLabelsAllowlist:
          - namespaces=[platform.michelecampi.dev/team,platform.michelecampi.dev/cost-center]
          - nodes=[karpenter.sh/capacity-type,node.kubernetes.io/instance-type,topology.kubernetes.io/zone]
        resources:
          requests: {cpu: 10m, memory: 64Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
