apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.6.0
    helm:
      releaseName: external-secrets
      # Starting requests (require-requests applies to the platform too),
      # to be checked against usage measured live.
      valuesObject:
        # Pool system, tainted CriticalAddonsOnly (modules/eks/main.tf); the
        # global values apply to the controller, webhook and cert controller.
        global:
          nodeSelector: {platform.michelecampi.dev/pool: system}
          tolerations: [{key: CriticalAddonsOnly, operator: Exists, effect: NoSchedule}]
        resources: {requests: {cpu: 10m, memory: 64Mi}}
        podSecurityContext: {enabled: true, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
        webhook:
          resources: {requests: {cpu: 10m, memory: 64Mi}}
          podSecurityContext: {enabled: true, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
        certController:
          resources: {requests: {cpu: 10m, memory: 64Mi}}
          podSecurityContext: {enabled: true, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
