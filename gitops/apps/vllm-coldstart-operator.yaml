apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vllm-coldstart-operator
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/MicheleCampi/vllm-coldstart-operator
    targetRevision: v0.14.0
    path: chart
    helm:
      releaseName: vcso
      valuesObject:
        example: {enabled: false}
        # Pool system, tainted CriticalAddonsOnly (modules/eks/main.tf);
        # values added in operator v0.14.0.
        nodeSelector: {platform.michelecampi.dev/pool: system}
        tolerations: [{key: CriticalAddonsOnly, operator: Exists, effect: NoSchedule}]
  destination:
    server: https://kubernetes.default.svc
    namespace: vllm-operator-system
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/names/categories
        - /spec/names/listKind
        - /spec/versions/0/additionalPrinterColumns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
