apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
spec:
  project: platform
  source:
    chart: karpenter
    repoURL: public.ecr.aws/karpenter
    targetRevision: 1.15.1
    helm:
      valuesObject:
        settings:
          clusterName: llm-inference
          interruptionQueue: llm-inference
        # Pool system (modules/eks/main.tf): never on a node Karpenter manages.
        # The chart already tolerates CriticalAddonsOnly and requires
        # karpenter.sh/nodepool DoesNotExist; a map value replaces the chart's
        # nodeSelector, so kubernetes.io/os stays listed.
        nodeSelector: {kubernetes.io/os: linux, platform.michelecampi.dev/pool: system}
        controller:
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "1", memory: 1Gi}
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
