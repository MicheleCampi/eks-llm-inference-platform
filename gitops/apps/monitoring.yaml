apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/MicheleCampi/eks-llm-inference-platform
    targetRevision: v2.0.0
    path: gitops/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # ESO fills the Secret at runtime (creationPolicy: Owner); it is not in Git.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: grafana-cloud-credentials
      namespace: monitoring
      jsonPointers: [/data]
    - group: "*"
      kind: "*"
      managedFieldsManagers: [external-secrets]
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true, SkipDryRunOnMissingResource=true]
    retry:
      limit: 10
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
