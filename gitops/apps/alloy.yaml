apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.10.0
    helm:
      releaseName: alloy
      values: |
        controller:
          type: deployment
          replicas: 1
        alloy:
          # Starting request, to be checked against usage measured live.
          resources: {requests: {cpu: 50m, memory: 128Mi}}
          extraEnv:
            - {name: GC_PROM_URL, valueFrom: {secretKeyRef: {name: grafana-cloud-credentials, key: url}}}
            - {name: GC_PROM_USER, valueFrom: {secretKeyRef: {name: grafana-cloud-credentials, key: user}}}
            - {name: GC_PROM_TOKEN, valueFrom: {secretKeyRef: {name: grafana-cloud-credentials, key: token}}}
          configMap:
            content: |
              // Karpenter controller metrics: Service kube-system/karpenter,
              // port http-metrics (8080, chart 1.15.1). Only up and the series
              // the dashboard and alert use are kept (free plan bound); names
              // from the Karpenter v1.15.1 metrics reference.
              discovery.kubernetes "karpenter" {
                role = "endpoints"
                namespaces {
                  names = ["kube-system"]
                }
                selectors {
                  role  = "service"
                  label = "app.kubernetes.io/name=karpenter"
                }
              }

              discovery.relabel "karpenter" {
                targets = discovery.kubernetes.karpenter.targets
                rule {
                  source_labels = ["__meta_kubernetes_endpoint_port_name"]
                  regex         = "http-metrics"
                  action        = "keep"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                // A declared job, so the alert rules do not depend on Alloy's default.
                rule {
                  target_label = "job"
                  replacement  = "karpenter"
                }
              }

              prometheus.scrape "karpenter" {
                targets    = discovery.relabel.karpenter.output
                forward_to = [prometheus.relabel.karpenter.receiver]
              }

              prometheus.relabel "karpenter" {
                forward_to = [prometheus.remote_write.grafana_cloud.receiver]
                rule {
                  source_labels = ["__name__"]
                  regex         = "up|karpenter_(nodeclaims_(created|terminated|disrupted)_total|nodes_(created|terminated)_total|nodes_allocatable|pods_state|pods_startup_duration_seconds.*|scheduler_scheduling_duration_seconds.*|nodepools_(usage|limit)|voluntary_disruption_decisions_total|interruption_.*)"
                  action        = "keep"
                }
              }

              // Right-sizing: usage from the kubelet (cAdvisor), requests and labels
              // from kube-state-metrics. Kubelet scraped directly on 10250 with the service
              // account token and TLS verified against the cluster CA (nodeadm sets
              // serverTLSBootstrap; that the CA validates it is checked live). RBAC:
              // nodes/metrics only, never nodes/proxy.
              discovery.kubernetes "nodes" {
                role = "node"
              }

              discovery.relabel "cadvisor" {
                targets = discovery.kubernetes.nodes.targets
                rule {
                  target_label = "__metrics_path__"
                  replacement  = "/metrics/cadvisor"
                }
                rule {
                  source_labels = ["__meta_kubernetes_node_name"]
                  target_label  = "node"
                }
                rule {
                  target_label = "job"
                  replacement  = "cadvisor"
                }
              }

              prometheus.scrape "cadvisor" {
                targets           = discovery.relabel.cadvisor.output
                scheme            = "https"
                bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
                tls_config {
                  ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
                }
                forward_to = [prometheus.relabel.rightsizing.receiver]
              }

              discovery.kubernetes "ksm" {
                role = "endpoints"
                namespaces {
                  names = ["monitoring"]
                }
                selectors {
                  role  = "service"
                  label = "app.kubernetes.io/name=kube-state-metrics"
                }
              }

              discovery.relabel "ksm" {
                targets = discovery.kubernetes.ksm.targets
                rule {
                  source_labels = ["__meta_kubernetes_endpoint_port_name"]
                  regex         = "http"
                  action        = "keep"
                }
                rule {
                  target_label = "job"
                  replacement  = "kube-state-metrics"
                }
              }

              prometheus.scrape "ksm" {
                targets    = discovery.relabel.ksm.output
                forward_to = [prometheus.relabel.rightsizing.receiver]
              }

              // Six series families only (free plan bound); pod-level and pause-container
              // cAdvisor series are dropped.
              prometheus.relabel "rightsizing" {
                forward_to = [prometheus.remote_write.grafana_cloud.receiver]
                rule {
                  source_labels = ["__name__"]
                  regex         = "up|container_cpu_usage_seconds_total|container_memory_working_set_bytes|kube_pod_container_resource_requests|kube_namespace_labels|kube_node_labels"
                  action        = "keep"
                }
                rule {
                  source_labels = ["__name__", "container"]
                  regex         = "container_.*;(|POD)"
                  action        = "drop"
                }
              }

              prometheus.remote_write "grafana_cloud" {
                endpoint {
                  url = sys.env("GC_PROM_URL")
                  basic_auth {
                    username = sys.env("GC_PROM_USER")
                    password = sys.env("GC_PROM_TOKEN")
                  }
                }
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
