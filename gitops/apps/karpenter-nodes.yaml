apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-nodes
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/MicheleCampi/eks-llm-inference-platform
    targetRevision: v2.2.9
    path: gitops/karpenter
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system  # resources are cluster-scoped; project platform allows only listed namespaces
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [SkipDryRunOnMissingResource=true]
