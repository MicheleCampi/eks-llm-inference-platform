apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-nodes
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MicheleCampi/eks-llm-inference-platform
    targetRevision: main
    path: gitops/karpenter
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [SkipDryRunOnMissingResource=true]
