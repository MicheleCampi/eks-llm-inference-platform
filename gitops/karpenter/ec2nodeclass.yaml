apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: llm-inference-node-role
  # Cost allocation: the Project tag of Terraform default_tags (providers.tf), so
  # the AWS Budget filtered on it sees node spend. ci/check-cost-tags.py keeps them equal.
  tags:
    Project: eks-llm-inference-platform
    ManagedBy: karpenter
    Owner: michele
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags: {karpenter.sh/discovery: llm-inference}
  securityGroupSelectorTerms:
    - tags: {karpenter.sh/discovery: llm-inference}
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
