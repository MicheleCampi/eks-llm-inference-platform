apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: llm-inference-node-role
  # Cost allocation: the Project tag of Terraform default_tags (providers.tf), so
  # the AWS Budget filtered on it sees node spend. ci/check-cost-tags.py keeps them equal.
  tags:
    Project: eks-llm-inference-platform
    ManagedBy: karpenter
    Owner: michele
  amiSelectorTerms:
    # Pinned: EKS 1.36 AL2023 release 1.36.5-20261119 (SSM recommended
    # release_version in eu-west-1, read 2026-11-22; was 20261107).
    # @latest would change nodes between applies.
    - alias: al2023@v20261119
  subnetSelectorTerms:
    - tags: {karpenter.sh/discovery: llm-inference}
  securityGroupSelectorTerms:
    - tags: {karpenter.sh/discovery: llm-inference}
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
