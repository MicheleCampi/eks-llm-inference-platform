# Pool "general": every workload that tolerates node replacement. Spot first:
# with both capacity types allowed Karpenter launches Spot (price-capacity-
# optimized across all offerings) and falls back to On-Demand only when no Spot
# offering is available. Platform controllers (ArgoCD, Karpenter itself, ESO,
# Kyverno, Alloy) run on pool "system", the managed node group (modules/eks).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general
spec:
  template:
    metadata:
      labels: {platform.michelecampi.dev/pool: general}
    spec:
      nodeClassRef: {group: karpenter.k8s.aws, kind: EC2NodeClass, name: default}
      requirements:
        # Free Plan constraint (README Findings #1): the account launches only
        # free-tier-eligible types, so the list is closed: 3 types x 2 zones x
        # 2 capacity types = 12 offerings. On a paid account this line is
        # replaced by attribute selectors, so Spot can draw from dozens of pools:
        #   - {key: karpenter.k8s.aws/instance-category, operator: In, values: [c, m, r]}
        #   - {key: karpenter.k8s.aws/instance-generation, operator: Gt, values: ["5"]}
        #   - {key: karpenter.k8s.aws/instance-cpu, operator: In, values: ["2", "4", "8"]}
        - {key: node.kubernetes.io/instance-type, operator: In, values: [c7i-flex.large, m7i-flex.large, t3.small]}
        - {key: karpenter.sh/capacity-type, operator: In, values: [spot, on-demand]}
        - {key: kubernetes.io/arch, operator: In, values: [amd64]}
      # Nodes older than 24h are replaced, so an AMI bump reaches every node within a day.
      expireAfter: 24h
      # Upper bound on a drain: after 1h pods still blocked by a PodDisruptionBudget or
      # karpenter.sh/do-not-disrupt are evicted, so expiry and drift cannot stall forever.
      terminationGracePeriod: 1h
  limits:
    cpu: "8"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
    # Voluntary disruption is rate-limited. Default for all reasons: at most 20% of the
    # nodes at once (Karpenter's own default is 10% and implicit). Drift (AMI bump,
    # NodeClass change) replaces nodes only outside 08:00-18:00 UTC on weekdays.
    # Spot interruptions and expiry are not voluntary and ignore budgets.
    budgets:
      - nodes: "20%"
      - nodes: "0"
        reasons: [Drifted]
        schedule: "0 8 * * mon-fri"
        duration: 10h
