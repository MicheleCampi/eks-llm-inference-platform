# NodeClass for pool "gpu" (gated, see nodepool-gpu.yaml). Same role, subnets,
# security groups, pinned AMI release and IMDSv2 settings as "default"; the
# root volume is larger because vLLM images and model weights are tens of GiB.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
spec:
  role: llm-inference-node-role
  tags:
    Project: eks-llm-inference-platform
    ManagedBy: karpenter
    Owner: michele
  amiSelectorTerms:
    # Same release as "default": for GPU instance types the al2023 alias
    # resolves to the NVIDIA variant of that release.
    - alias: al2023@v20261119
  subnetSelectorTerms:
    - tags: {karpenter.sh/discovery: llm-inference}
  securityGroupSelectorTerms:
    - tags: {karpenter.sh/discovery: llm-inference}
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs: {volumeSize: 100Gi, volumeType: gp3, encrypted: true, deleteOnTermination: true}
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
