# Argo CD install: upstream v3.6.2 manifest vendored in upstream/ (SHA-256
# pinned in ci/versions.env, checked in CI) plus two changes:
#  - a pod securityContext on the 4 workloads that had none (trivy KSV-0118).
#    Their containers already run non-root with seccomp RuntimeDefault; this
#    states it at pod level too.
#  - Dex removed. It only serves SSO, which this platform does not use (admin
#    login, then accounts by GitOps); an unused component is attack surface and
#    its image carried fixable CRITICAL CVEs (ci/image-scan-baseline.txt). The
#    argocd-server Dex settings are optional (configMapKeyRef optional, TLS
#    secret volume optional), so the server runs without it. To add SSO later:
#    delete these patches and set dex.config in argocd-cm.
#  - every Deployment and StatefulSet on pool system with the
#    CriticalAddonsOnly toleration: that node group is tainted so only
#    platform controllers run there (modules/eks/main.tf, game day #1 S3).
# Apply: kubectl apply -k gitops/argocd --server-side
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - upstream/install-v3.6.2.yaml
patches:
  - target: {kind: Deployment}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: any}
      spec:
        template:
          spec:
            nodeSelector: {platform.michelecampi.dev/pool: system}
            tolerations: [{key: CriticalAddonsOnly, operator: Exists, effect: NoSchedule}]
  - target: {kind: StatefulSet}
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata: {name: any}
      spec:
        template:
          spec:
            nodeSelector: {platform.michelecampi.dev/pool: system}
            tolerations: [{key: CriticalAddonsOnly, operator: Exists, effect: NoSchedule}]
  - target:
      kind: (Deployment|StatefulSet)
      name: argocd-(applicationset-controller|repo-server|server|application-controller)
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext
        value: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: argocd-dex-server}
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: {name: argocd-dex-server}
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata: {name: argocd-dex-server}
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata: {name: argocd-dex-server}
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata: {name: argocd-dex-server}
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: {name: argocd-dex-server-network-policy}
