# No auth block: ESO calls Secrets Manager with its own pod credentials, which
# EKS Pod Identity maps to the llm-inference-eso role (modules/eks/eso.tf),
# allowed to read only this one secret. No key and no role ARN in Git.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: monitoring
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-cloud-credentials
  namespace: monitoring
spec:
  # All fields the ESO v1 CRD defaults are written out, so Argo CD sees no drift.
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: grafana-cloud-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: url
      remoteRef: {key: llm-inference/grafana-cloud-remote-write, property: url, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None, nullBytePolicy: Ignore}
    - secretKey: user
      remoteRef: {key: llm-inference/grafana-cloud-remote-write, property: user, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None, nullBytePolicy: Ignore}
    - secretKey: token
      remoteRef: {key: llm-inference/grafana-cloud-remote-write, property: token, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None, nullBytePolicy: Ignore}
