# Path C: Kueue v0.20.6 quota per team, the job-queueing model a GPU
# platform uses for batch work (evaluation, fine-tuning, embedding runs).
# Here on CPU: a ClusterQueue with 2 CPU / 2Gi shared by two teams, each
# with its own LocalQueue. Expected: jobs that fit run at once, the rest
# wait as Workloads (QuotaReserved=False) and start in order as quota frees,
# with no Pending pods on the nodes.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: default-flavor
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: shared
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources: ["cpu", "memory"]
      flavors:
        - name: default-flavor
          resources:
            - {name: cpu, nominalQuota: 2}
            - {name: memory, nominalQuota: 2Gi}
---
apiVersion: v1
kind: Namespace
metadata: {name: team-a}
---
apiVersion: v1
kind: Namespace
metadata: {name: team-b}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: batch, namespace: team-a}
spec: {clusterQueue: shared}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: batch, namespace: team-b}
spec: {clusterQueue: shared}
