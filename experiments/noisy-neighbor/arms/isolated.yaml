# Arm isolated: one pool per tenant. Each replica accepts only its own
# tenant (and the serving namespace's own pods: calibration, cache reset).
# Same two policies as arms/shared.yaml, by name, so applying one arm
# replaces the other.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pool-premium-ingress
  namespace: bench
spec:
  podSelector:
    matchLabels: {app: model, pool: premium}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: tenant-premium}}
      ports:
        - {protocol: TCP, port: 8000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pool-batch-ingress
  namespace: bench
spec:
  podSelector:
    matchLabels: {app: model, pool: batch}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: tenant-batch}}
      ports:
        - {protocol: TCP, port: 8000}
